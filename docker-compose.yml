services:
  postgres:
    image: postgres:17
    environment:
      POSTGRES_DB: seatreservation
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${DATABASE_PASSWORD:-postgres}
    ports:
      - "5433:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d seatreservation"]
      interval: 5s
      timeout: 5s
      retries: 12

  app:
    build:
      context: .
      dockerfile: Dockerfile
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DATABASE_URL: jdbc:postgresql://postgres:5432/seatreservation
      DATABASE_USERNAME: postgres
      DATABASE_PASSWORD: ${DATABASE_PASSWORD:-postgres}
      ADMIN_TOKEN: ${ADMIN_TOKEN:-admin-secret}
    ports:
      - "8080:8080"
    restart: unless-stopped

volumes:
  postgres-data:
